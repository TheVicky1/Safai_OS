name: Bug Report
description: Report a reproducible bug or defect in SafaiOS
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in SafaiOS! Please provide as much detail as possible so the maintainers can reproduce and resolve the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Explain what happened unexpectedly...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Inspect output
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output and Traceback
      description: Copy and paste the full error output or stack trace.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 / 10
        - Ubuntu / Debian Linux
        - macOS (Apple Silicon M1/M2/M3/M4)
        - macOS (Intel)
        - Other Linux distribution
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g. Python 3.11.17
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Verification
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I reviewed the Troubleshooting and FAQ guide in the Wiki.
          required: true

