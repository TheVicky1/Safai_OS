name: Feature Request
description: Propose a new feature, architecture enhancement, or tool for SafaiOS
title: "[FEAT] "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to SafaiOS! We welcome ideas that enhance computer vision accuracy, optimize edge inference, expand database security, or improve municipal workflow automation.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
      placeholder: Detailed description of the feature or architecture design...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.

  - type: dropdown
    id: domain
    attributes:
      label: Technical Subsystem
      options:
        - Computer Vision / YOLO11s Models
        - Dataset Pipelines and Augmentation
        - Supabase / Postgres Database and RLS
        - Citizen and Driver Mobile Application
        - Municipal Admin Dashboard
        - Developer Tooling and Quality Gates
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution Intent
      options:
        - label: I am willing to submit a pull request implementing this feature!

