name: Dependency Health & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays at midnight UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Health & Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Check out repository source
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Upgrade packaging utilities
      run: |
        python -m pip install --upgrade pip setuptools wheel pip-audit

    - name: Audit Python dependencies for known CVE vulnerabilities
      run: |
        echo "Running pip-audit against requirements.txt..."
        pip-audit -r requirements.txt --desc on

    - name: Verify dependency compatibility and integrity
      run: |
        python -m pip check

    - name: Verify repository license compliance
      run: |
        node -e "
          const fs = require('fs');
          if (!fs.existsSync('LICENSE')) {
            console.error('Missing root LICENSE file');
            process.exit(1);
          }
          console.log('License verification passed: MIT license active.');
        "

