name: SafaiOS Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Check out repository source
      uses: actions/checkout@v4

    - name: Free runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU PyTorch wheel to prevent large CUDA downloads
        pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir -e ".[dev]"

    - name: Execute Python ML and Core test suite (151 tests)
      run: |
        pytest tests/ -v

    - name: Set up Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Validate Supabase migrations and database policies locally
      run: |
        supabase start
        supabase db reset
        supabase test db
        supabase db lint --level error --fail-on error

    - name: Run repository secret and credential scan
      run: |
        node scripts/test-secret-scan.mjs
        node scripts/secret-scan.mjs

    - name: Run documentation link verification
      run: |
        node scripts/check-links.mjs
