[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safaios-waste-detection"
version = "0.1.0"
description = "The Intelligence Behind Cleaner Cities. Computer vision waste detection model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SafaiOS Team" }
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "ultralytics>=8.3.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "pillow>=9.5.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "scikit-learn>=1.2.0",
  "tqdm>=4.65.0",
  "psutil>=5.9.0",
  "requests>=2.31.0",
  "albumentations==2.0.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
